name: Vérifier ÉLAN
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests du moteur et de l'audio
        run: npm test
      - name: Installer le navigateur de test
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Vérifier les parcours mobile et ordinateur
        run: |
          python3 -m http.server 8080 > /tmp/elan-http.log 2>&1 &
          node tools/qa/browser.cjs
      - name: Conserver les captures de contrôle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elan-captures
          path: artifacts/*.png
          if-no-files-found: ignore
